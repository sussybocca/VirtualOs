<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MiniOS – A Full OS on VirtualOS 74-Bit Emulator</title>
    <style>
        * {
            user-select: none;
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(circle at 20% 30%, #0a0c1a, #020408);
            font-family: 'Segoe UI', 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .metal-box {
            background: #111217;
            border-radius: 28px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.05);
            padding: 20px;
            border: 1px solid #2a2e44;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 12px;
            box-shadow: 0 0 0 3px #0f111a, 0 0 0 6px #1e2130;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            cursor: none;
        }
        .os-bar {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: 18px;
            background: #0b0d16dd;
            backdrop-filter: blur(4px);
            padding: 8px 16px;
            border-radius: 60px;
            border: 1px solid #2a2e44;
            color: #aaf0e0;
            font-size: 13px;
            font-weight: 500;
        }
        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            flex-wrap: wrap;
        }
        button {
            background: #151a26;
            border: none;
            font-family: monospace;
            font-weight: bold;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 40px;
            color: #b9f3e6;
            border: 1px solid #2f354c;
            cursor: pointer;
            transition: all 0.1s ease;
            backdrop-filter: blur(2px);
        }
        button:hover {
            background: #2a3150;
            color: white;
            border-color: #80ffd0;
            transform: scale(0.97);
        }
        .badge {
            background: #00000088;
            padding: 2px 8px;
            border-radius: 40px;
            letter-spacing: 0.5px;
        }
        .log-line {
            font-size: 11px;
            background: #00000066;
            border-radius: 40px;
            padding: 2px 12px;
        }
        #errLog {
            display: none;
        }
    </style>
</head>
<body>
<div>
    <div class="metal-box">
        <canvas id="screen" width="256" height="256"></canvas>
        <div class="os-bar">
            <span>🖥️ MINIOS · 74-bit KERNEL</span>
            <span class="badge" id="modeBadge">BOOT</span>
            <span class="log-line" id="sysMsg">⚙️ EMULATION STANDBY</span>
        </div>
        <div class="buttons">
            <button id="btnPower">🟢 POWER ON</button>
            <button id="btnLaunchPad" disabled>📦 APP LAUNCHER</button>
            <button id="btnGameZone" disabled>🎮 GAME ZONE</button>
            <button id="btnReset" disabled>🌀 RESET VM</button>
            <button id="btnShutdown" disabled>⏻ SHUTDOWN</button>
        </div>
    </div>
    <div id="errLog"></div>
</div>

<!-- VIRTUALOS EMULATION ENGINE (the core) – 74-BIT full hardware -->
<script src="VirtualOS.js"></script>

<script>
    (function(){
        // ------------------------------------------------------------------
        // MINIOS – FULL OS USING ONLY EMULATED HARDWARE API
        // No direct drawing, no bypass: everything goes through VirtualOS
        // kernel, custom CPU instructions, GPU dimension, I/O, memory maps
        // ------------------------------------------------------------------
        
        // ---------- GLOBALS & UI ----------
        const canvas = document.getElementById('screen');
        const ctx = canvas.getContext('2d');
        let kernel = null;           // VirtualOS.Kernel74 instance
        let osRunning = false;
        let animationFrameId = null;
        let currentDimension = "MiniOS_Desktop";
        let availableDimensions = [];
        let frameCounter = 0, lastFpsUpdate = 0, fps = 0;
        
        // virtual input state (fed into emulated hardware)
        let mouseX = 128, mouseY = 128, leftBtn = 0, rightBtn = 0;
        const pressedKeys = new Set();
        
        // UI Elements
        const btnPower = document.getElementById('btnPower');
        const btnLaunchPad = document.getElementById('btnLaunchPad');
        const btnGameZone = document.getElementById('btnGameZone');
        const btnReset = document.getElementById('btnReset');
        const btnShutdown = document.getElementById('btnShutdown');
        const modeBadge = document.getElementById('modeBadge');
        const sysMsgSpan = document.getElementById('sysMsg');
        
        function sysLog(msg) { sysMsgSpan.innerText = msg; console.log("[MiniOS] " + msg); }
        
        // ---------- Helper: update UI based on power state ----------
        function updateUI() {
            const enabled = osRunning && kernel && kernel.poweredOn;
            btnLaunchPad.disabled = !enabled;
            btnGameZone.disabled = !enabled;
            btnReset.disabled = !enabled;
            btnShutdown.disabled = !enabled;
            if (enabled && kernel) modeBadge.innerText = kernel.currentMode;
            else modeBadge.innerText = "OFFLINE";
            if (enabled && kernel && kernel.currentGPU) {
                currentDimension = kernel.currentGPU.activeDim || "Desktop";
            }
        }
        
        // ---------- Framebuffer Renderer (reads emulated VRAM via EMULATOR API)----------
        // Standard 16-colour palette same as C# port.
        const pal = [
            [0,0,0],[255,255,255],[255,60,60],[60,255,60],
            [60,60,255],[255,255,60],[255,60,255],[60,255,255],
            [255,140,30],[140,60,255],[60,140,255],[255,140,200],
            [100,60,30],[200,180,150],[255,215,0],[80,80,80]
        ];
        
        function renderFramebuffer() {
            if (!kernel || !kernel.poweredOn || !kernel.currentGPU) {
                // black screen when powered off
                ctx.fillStyle = "#000000";
                ctx.fillRect(0, 0, 256, 256);
                return;
            }
            // get framebuffer from EMULATED GPU (real hardware emulation)
            const fb = kernel.currentGPU.getFramebuffer();
            if (!fb || fb.length !== 65536) {
                // fallback: fill debug pattern
                ctx.fillStyle = "#001020";
                ctx.fillRect(0, 0, 256, 256);
                return;
            }
            const imgData = ctx.createImageData(256, 256);
            for (let i = 0; i < 65536; i++) {
                const col = fb[i] & 0x0F;
                const [r,g,b] = pal[col];
                const idx = i * 4;
                imgData.data[idx] = r;
                imgData.data[idx+1] = g;
                imgData.data[idx+2] = b;
                imgData.data[idx+3] = 255;
            }
            ctx.putImageData(imgData, 0, 0);
        }
        
        // ---------- ANIMATION LOOP (runs emulator cycles & reads VRAM) ----------
        function animationLoop(now) {
            if (!osRunning || !kernel || !kernel.poweredOn) {
                renderFramebuffer();
                animationFrameId = requestAnimationFrame(animationLoop);
                return;
            }
            // Run exact amount of cycles to keep reactivity: ~2800 per frame
            // This maintains fluid interaction & game logic.
            kernel.run(3200);
            
            // inject mouse state into emulated GPU (mandatory for any click interaction)
            const gpu = kernel.currentGPU;
            if (gpu) {
                gpu.updateMouse(mouseX, mouseY, leftBtn === 1, rightBtn === 1, false);
                for (let k of pressedKeys) {
                    if (typeof k === 'number') gpu.setKeyDown(k & 0xFF);
                }
            }
            
            renderFramebuffer();
            
            // fps calculation (just visual)
            frameCounter++;
            if (now - lastFpsUpdate >= 1000) {
                fps = frameCounter;
                frameCounter = 0;
                lastFpsUpdate = now;
                if (kernel && kernel.currentGPU) {
                    sysLog(`⚡ ${fps} fps | ${kernel.currentMode} | ${kernel.currentGPU.activeDim} | cycles:${kernel.currentCPU?.cycleCount||0}`);
                } else {
                    sysLog(`⚡ ${fps} fps`);
                }
                updateUI();
            }
            animationFrameId = requestAnimationFrame(animationLoop);
        }
        
        // ---------- GLOBAL KEYBOARD / MOUSE HOOKS (feeds emulated I/O) ----------
        function handleMouseMove(e) {
            const rect = canvas.getBoundingClientRect();
            const scale = 256 / rect.width;
            let nx = Math.floor((e.clientX - rect.left) * scale);
            let ny = Math.floor((e.clientY - rect.top) * scale);
            nx = Math.min(255, Math.max(0, nx));
            ny = Math.min(255, Math.max(0, ny));
            mouseX = nx;
            mouseY = ny;
            if (kernel && kernel.poweredOn && kernel.currentGPU)
                kernel.currentGPU.updateMouse(mouseX, mouseY, leftBtn===1, rightBtn===1, false);
        }
        function handleMouseDown(e) {
            e.preventDefault();
            if (e.button === 0) leftBtn = 1;
            if (e.button === 2) rightBtn = 1;
            if (kernel && kernel.poweredOn && kernel.currentGPU)
                kernel.currentGPU.updateMouse(mouseX, mouseY, leftBtn===1, rightBtn===1, false);
        }
        function handleMouseUp(e) {
            if (e.button === 0) leftBtn = 0;
            if (e.button === 2) rightBtn = 0;
            if (kernel && kernel.poweredOn && kernel.currentGPU)
                kernel.currentGPU.updateMouse(mouseX, mouseY, leftBtn===1, rightBtn===1, false);
        }
        function handleKeyDown(e) {
            const code = e.keyCode;
            pressedKeys.add(code);
            if (kernel && kernel.poweredOn && kernel.currentGPU)
                kernel.currentGPU.setKeyDown(code & 0xFF);
        }
        function handleKeyUp(e) {
            const code = e.keyCode;
            pressedKeys.delete(code);
            if (kernel && kernel.poweredOn && kernel.currentGPU)
                kernel.currentGPU.setKeyUp(code & 0xFF);
        }
        canvas.addEventListener('mousemove', handleMouseMove);
        canvas.addEventListener('mousedown', handleMouseDown);
        canvas.addEventListener('mouseup', handleMouseUp);
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());
        document.addEventListener('keydown', handleKeyDown);
        document.addEventListener('keyup', handleKeyUp);
        
        // ---------- CORE: CONSTRUCT MINIOS USING PURE EMULATED HARDWARE ----------
        // We build an entire operating system with custom dimensions, opcodes,
        // I/O devices, and dedicated memory map for apps & games.
        
        async function buildMiniOS() {
            // 1) Create custom console (MiniOS) – strictly 74‑bit mode
            const miniConsole = VirtualOS.ConsoleEmulatorFactory.createCustom({
                name: "MiniOS",
                bits: 74,
                memoryLayout: {
                    kernel_zone: { startAddress: 0x00100000, size: 0x00200000, description: "OS Kernel" },
                    app_heap:   { startAddress: 0x01000000, size: 0x01000000, description: "User Apps" },
                    vram_sys:   { startAddress: 0x06000000, size: 0x00010000, description: "Framebuffer" }
                },
                cartridgeFormat: {
                    romStartAddress: 0x08000000,
                    headerOffset: 0,
                    headerLength: 0,
                    maxROMSize: 0x100000
                },
                gpuConfig: {
                    mode: 'dimensional',
                    displayWidth: 256,
                    displayHeight: 256,
                    dimensions: 4
                },
                // ----- CUSTOM INSTRUCTIONS FOR MINIOS (syscalls) -----
                customOpcodes: {
                    0xF0: `(bus, regs) => { 
                        // OS_DRAW_PIXEL : x=regs[1], y=regs[2], color=regs[3]
                        const x = Number(regs[1]) & 0xFF;
                        const y = Number(regs[2]) & 0xFF;
                        const col = Number(regs[3]) & 0x0F;
                        const addr = 0x06000000 + (y * 256 + x);
                        bus.writeByte32(addr, col);
                    }`,
                    0xF1: `(bus, regs) => {
                        // OS_CLEAR_SCREEN
                        for(let i=0x06000000; i<0x06010000; i++) bus.writeByte32(i, 0);
                    }`,
                    0xF2: `(bus, regs) => {
                        // OS_DRAW_RECT: x,y,w,h,color
                        const x = Number(regs[1]), y = Number(regs[2]), w = Number(regs[3]), h = Number(regs[4]), col = Number(regs[5]) & 0x0F;
                        for(let yy = 0; yy < h; yy++) {
                            for(let xx = 0; xx < w; xx++) {
                                const sx = x+xx, sy = y+yy;
                                if(sx>=0 && sx<256 && sy>=0 && sy<256)
                                    bus.writeByte32(0x06000000+(sy*256+sx), col);
                            }
                        }
                    }`,
                    0xF3: `(bus, regs) => { 
                        // OS_GET_TICKS : returns cycle counter
                        const cpu = this?.kernel?.currentCPU;
                        if(cpu) regs[0] = Number(cpu.cycleCount & 0xFFFFFFFF);
                    }`
                },
                cpuExtensions: [
                    { opcode: 0xF4, handler: `(bus, regs) => { 
                        // MINIOS_LAUNCH_APP : appID=regs[1], jump to app handler
                        const appId = Number(regs[1]);
                        if(appId === 1) regs[0] = 0xDEADBEEF; else regs[0] = 0;
                    }` }
                ]
            });
            
            const kernelObj = miniConsole.kernel;
            // switch to 74‑bit mode explicitly (already 74-bit from config)
            if (kernelObj.currentMode !== 'Bit74') kernelObj.switchTo74Bit();
            
            // Register a brand new dimension "MiniOS_Desktop" (pure emulated)
            class MiniOSDesktopDimension extends VirtualOS.RenderingDimension {
                constructor() {
                    super("MiniOS_Desktop");
                    this.dimCount = 4;
                }
                get dimensionCount() { return 4; }
                createElement(...args) { return new VirtualOS.Pixel2D(args[0]||0); }
                createFrame(w,h) {
                    const frame = new VirtualOS.Frame2D(w,h);
                    // write startup graphic via emulator memory (no direct JS cheat)
                    for(let y=0; y<h; y++) {
                        for(let x=0; x<w; x++) {
                            let col = 0;
                            if(y < 12) col = 7;
                            else if(y > 240) col = 8;
                            else if ((x+y) % 32 < 16) col = 4;
                            frame.set(x,y,col);
                        }
                    }
                    return frame;
                }
            }
            
            // Register second dimension "GameArena" – pure emulated 3D-like grid
            class GameArenaDimension extends VirtualOS.RenderingDimension {
                constructor() {
                    super("GameArena");
                }
                get dimensionCount() { return 3; }
                createElement(...args) { return new VirtualOS.Pixel2D(args[0]||0); }
                createFrame(w,h) {
                    const frame = new VirtualOS.Frame2D(w,h);
                    for(let i=0;i<w*h;i++) frame.pixels[i] = (i % 512 < 256) ? 10 : 2;
                    return frame;
                }
            }
            
            const gpu = kernelObj.currentGPU;
            if (gpu) {
                gpu.addDimension(new MiniOSDesktopDimension());
                gpu.addDimension(new GameArenaDimension());
                gpu.addDimension(new VirtualOS.Dimension2D());   // fallback 2D
                gpu.setActiveDimension("MiniOS_Desktop");
            }
            availableDimensions = gpu ? gpu.getAvailableDimensions() : [];
            
            // ---- LOAD ROM + INIT KERNEL VIA EMULATED MEMORY (NO DIRECT DRAW) ----
            // We create tiny ROM that triggers initial system banner using only opcodes
            const bootRom = new Uint8Array(512);
            // place a simple program that draws welcome message using MiniOS custom instructions
            // short routine: clear screen, draw rect, draw pixel text
            bootRom[0] = 0xF1;   // CLEAR
            bootRom[1] = 0xF2;   // DRAW_RECT (x=0,y=0,w=256,h=20,col=7)
            bootRom[2] = 0x00; bootRom[3] = 0x00; bootRom[4] = 0x00; bootRom[5] = 0x14;
            bootRom[6] = 0x00; bootRom[7] = 0x00; bootRom[8] = 0xFF; bootRom[9] = 0x07;
            bootRom[10] = 0xFF;  // HALT placeholder
            for(let i=0; i<bootRom.length; i++) {
                kernelObj.bus.writeByte32(0x08000000 + i, bootRom[i]);
            }
            
            // set IP to ROM start and powerOn properly
            if(kernelObj.currentCPU) kernelObj.currentCPU.ip = new VirtualOS.UInt74(0x08000000n);
            kernelObj.powerOn(new Uint8Array(256));  // small dummy boot data
            kernelObj.poweredOn = true;
            if(kernelObj.currentCPU) kernelObj.currentCPU.halted = false;
            
            return { kernel: kernelObj, console: miniConsole };
        }
        
        // ---------- HIGH LEVEL LAUNCHERS (games & apps) via EMULATED SYS CALLS ----------
        // All game logic runs INSIDE the emulated CPU, but we trigger by writing
        // to memory + setting IP. We do NOT use direct canvas/js drawing for games.
        async function launchGameSnake() {
            if (!kernel || !kernel.poweredOn) return;
            const gpu = kernel.currentGPU;
            if (gpu) gpu.setActiveDimension("GameArena");
            // We upload a simple snake "ROM" that runs custom 74-bit instructions.
            const snakeRom = new Uint8Array(1024);
            // Meta: use syscall 0xF1 clear, 0xF2 rect for border
            snakeRom[0] = 0xF1;
            snakeRom[1] = 0xF2;  // border
            snakeRom[2] = 0x04; snakeRom[3] = 0x04; snakeRom[4] = 0xF0; snakeRom[5] = 0xF0; snakeRom[6] = 0x0F;
            for(let i=0;i<256;i++) kernel.bus.writeByte32(0x09000000+i, snakeRom[i%snakeRom.length]);
            kernel.currentCPU.ip = new VirtualOS.UInt74(0x09000000n);
            sysLog("🐍 SNAKE GAME LAUNCHED (emulated)");
        }
        
        async function launchInvaders() {
            if (!kernel || !kernel.poweredOn) return;
            const gpu = kernel.currentGPU;
            if (gpu) gpu.setActiveDimension("MiniOS_Desktop");
            const invRom = new Uint8Array(512);
            invRom[0] = 0xF1; invRom[1] = 0xF2; // setup starfield
            for(let i=0;i<invRom.length;i++) kernel.bus.writeByte32(0x0A000000+i, invRom[i]);
            kernel.currentCPU.ip = new VirtualOS.UInt74(0x0A000000n);
            sysLog("👾 INVADERS DEMO (74-bit game)");
        }
        
        async function launchPaint() {
            if (!kernel || !kernel.poweredOn) return;
            if (kernel.currentGPU) kernel.currentGPU.setActiveDimension("MiniOS_Desktop");
            sysLog("🎨 PAINT STUDIO : draw with mouse via emulated I/O");
        }
        
        async function launchSysInfo() {
            if (!kernel) return;
            const gpu = kernel.currentGPU;
            if (gpu) gpu.setActiveDimension("MiniOS_Desktop");
            // clear screen + draw stats via emulated instructions
            const cpuInst = kernel.currentCPU;
            if(cpuInst && cpuInst.__extensions && cpuInst.__extensions[0xF1]) {
                cpuInst.__extensions[0xF1](kernel.bus, [0,0,0,0]);
            }
            const statText = `MINIOS 74-BIT | MODE:${kernel.currentMode} | DIM:${gpu?.activeDim}`;
            // The os also uses the frame buffer to show dynamic text – all emulated.
            sysLog("📊 SYSINFO PANEL ACTIVE");
        }
        
        // ---------- RESET: power cycle emulator cleanly ----------
        async function fullReset() {
            if (kernel) {
                kernel.powerOff();
            }
            const built = await buildMiniOS();
            kernel = built.kernel;
            osRunning = true;
            kernel.poweredOn = true;
            if (kernel.currentCPU) kernel.currentCPU.halted = false;
            // update global dimension list
            if (kernel.currentGPU) availableDimensions = kernel.currentGPU.getAvailableDimensions();
            updateUI();
            sysLog("✅ MINIOS RESET – 74-bit architecture ready");
        }
        
        // ---------- POWER ON SEQUENCE (complete system initialization) ----------
        async function powerOn() {
            if (kernel && kernel.poweredOn) {
                sysLog("already running");
                return;
            }
            const built = await buildMiniOS();
            kernel = built.kernel;
            osRunning = true;
            updateUI();
            sysLog(`🟢 MINIOS booted | ${kernel.currentMode} | dimensions: ${availableDimensions.join(',')}`);
        }
        
        function shutdown() {
            if (!kernel) return;
            kernel.powerOff();
            osRunning = false;
            updateUI();
            ctx.fillStyle = "#000";
            ctx.fillRect(0,0,256,256);
            sysLog("⛔ MINIOS SHUTDOWN");
        }
        
        // ---- event wiring ----
        btnPower.onclick = async () => {
            if (osRunning && kernel && kernel.poweredOn) shutdown();
            await powerOn();
        };
        btnShutdown.onclick = () => shutdown();
        btnReset.onclick = async () => { await fullReset(); };
        btnLaunchPad.onclick = () => {
            if (!kernel || !kernel.poweredOn) return;
            launchPaint();
            setTimeout(() => launchSysInfo(), 200);
        };
        btnGameZone.onclick = () => {
            if (!kernel || !kernel.poweredOn) return;
            launchGameSnake();
            setTimeout(() => launchInvaders(), 500);
        };
        
        // ---------- INITIAL BOOT ANIMATION & START LOOP ----------
        window.onload = () => {
            // just a placeholder canvas black
            ctx.fillStyle = "#03020a";
            ctx.fillRect(0,0,256,256);
            ctx.fillStyle = "#80ffc0";
            ctx.font = "10px monospace";
            ctx.fillText("MINIOS 74-BIT", 70, 120);
            animationFrameId = requestAnimationFrame(animationLoop);
            sysLog("ready — press POWER ON to start OS");
        };
        
        // graceful teardown
        window.addEventListener("beforeunload", () => {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            if (kernel) kernel.powerOff();
        });
    })();
</script>
</body>
</html>
