<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MiniOS - REAL 74-Bit Emulation</title>
    <style>
        body { background:#0a0a0f; color:#c0c0d0; font-family:monospace; padding:20px; }
        canvas { border:2px solid #00ffaa; image-rendering:pixelated; width:512px; height:512px; background:#000; }
        .bar { background:#000; border:1px solid #333; padding:8px; margin-top:8px; font-size:11px; color:#00cc88; }
        button { padding:6px 14px; margin:4px; border:1px solid #00cc88; background:transparent; color:#00cc88; cursor:pointer; }
    </style>
</head>
<body>
    <canvas id="screen" width="256" height="256"></canvas>
    <div class="bar" id="log">[MINIOS] Ready</div>
    <button id="btnPower">⚡ BOOT REAL MINIOS</button>

    <script src="VirtualOS.js"></script>
    <script>
        const canvas = document.getElementById('screen');
        const ctx = canvas.getContext('2d');
        const logDiv = document.getElementById('log');
        
        const PAL = [
            [0,0,0],[255,255,255],[255,60,60],[60,255,60],
            [60,60,255],[255,255,60],[255,60,255],[60,255,255],
            [255,140,30],[140,60,255],[60,140,255],[255,140,200],
            [100,60,30],[200,180,150],[255,215,0],[80,80,80]
        ];
        
        function log(msg) { logDiv.textContent = msg; console.log(msg); }
        
        // Create console with custom DRAW instruction
        const console = VirtualOS.ConsoleEmulatorFactory.createCustom({
            name: "MiniOS",
            bits: 32,
            gpuConfig: { mode: 'pixel', displayWidth: 256, displayHeight: 256 },
            customOpcodes: {
                0xF0: `(bus, regs) => {
                    // DRAW PIXEL: R1=x, R2=y, R3=color
                    const x = Number(regs[1]) & 0xFF;
                    const y = Number(regs[2]) & 0xFF;
                    const col = Number(regs[3]) & 0x0F;
                    bus.writeByte32(0x06000000 + (y * 256 + x), col);
                }`,
                0xF1: `(bus, regs) => {
                    // CLEAR SCREEN
                    for(let i = 0x06000000; i < 0x06010000; i++) bus.writeByte32(i, 0);
                }`,
                0xF2: `(bus, regs) => {
                    // DRAW RECT: R1=x, R2=y, R3=w, R4=h, R5=color
                    const x = Number(regs[1]), y = Number(regs[2]);
                    const w = Number(regs[3]), h = Number(regs[4]);
                    const col = Number(regs[5]) & 0x0F;
                    for(let yy = 0; yy < h; yy++) {
                        for(let xx = 0; xx < w; xx++) {
                            const sx = x + xx, sy = y + yy;
                            if(sx >= 0 && sx < 256 && sy >= 0 && sy < 256)
                                bus.writeByte32(0x06000000 + (sy * 256 + sx), col);
                        }
                    }
                }`
            }
        });
        
        const kernel = console.kernel;
        kernel.switchTo32Bit();
        
        // Pre-allocate VRAM
        for (let addr = 0x06000000; addr < 0x06010000; addr += 4096) {
            kernel.bus.pages.set(Math.floor(addr / 4096), new Uint8Array(4096));
        }
        
        // REAL MACHINE CODE ROM that executes on the CPU
        function createMiniOSROM() {
            const rom = new Uint8Array(2048);
            let p = 0;
            
            // Clear screen
            rom[p++] = 0xF1;
            
            // Draw title bar (x=0,y=0,w=256,h=16,color=7)
            rom[p++] = 0xF2;
            rom[p++] = 0x00; rom[p++] = 0x00;  // x=0
            rom[p++] = 0x00; rom[p++] = 0x00;  // y=0
            rom[p++] = 0x00; rom[p++] = 0x01;  // w=256
            rom[p++] = 0x10; rom[p++] = 0x00;  // h=16
            rom[p++] = 0x07; rom[p++] = 0x00;  // color=7
            
            // Draw taskbar (x=0,y=240,w=256,h=16,color=8)
            rom[p++] = 0xF2;
            rom[p++] = 0x00; rom[p++] = 0x00;  // x=0
            rom[p++] = 0xF0; rom[p++] = 0x00;  // y=240
            rom[p++] = 0x00; rom[p++] = 0x01;  // w=256
            rom[p++] = 0x10; rom[p++] = 0x00;  // h=16
            rom[p++] = 0x08; rom[p++] = 0x00;  // color=8
            
            // Draw "M" logo at (10,20)
            const logo = [
                [10,20,15],[11,20,15],[12,20,15],[13,20,15],[14,20,15],
                [10,21,15],[14,21,15],[10,22,15],[14,22,15],[10,23,15],
                [14,23,15],[10,24,15],[14,24,15],[10,25,15],[11,25,15],
                [12,25,15],[13,25,15],[14,25,15]
            ];
            for (let px of logo) {
                rom[p++] = 0xF0;
                rom[p++] = px[0]; rom[p++] = 0x00;
                rom[p++] = px[1]; rom[p++] = 0x00;
                rom[p++] = px[2]; rom[p++] = 0x00;
            }
            
            // Draw MINIOS text using pixels
            const textPixels = [
                [30,20,15],[31,20,15],[32,20,15],[33,20,15],[34,20,15],[35,20,15],[36,20,15],[37,20,15],
                [30,21,15],[37,21,15],[30,22,15],[37,22,15],[30,23,15],[37,23,15],[30,24,15],[37,24,15],
                [30,25,15],[31,25,15],[32,25,15],[33,25,15],[34,25,15],[35,25,15],[36,25,15],[37,25,15]
            ];
            for (let px of textPixels) {
                rom[p++] = 0xF0;
                rom[p++] = px[0]; rom[p++] = 0x00;
                rom[p++] = px[1]; rom[p++] = 0x00;
                rom[p++] = px[2]; rom[p++] = 0x00;
            }
            
            // Draw 3 app icons as rectangles
            // Icon 1: CALC (x=20,y=60,w=24,h=24,color=11)
            rom[p++] = 0xF2;
            rom[p++] = 20; rom[p++] = 0x00;
            rom[p++] = 60; rom[p++] = 0x00;
            rom[p++] = 24; rom[p++] = 0x00;
            rom[p++] = 24; rom[p++] = 0x00;
            rom[p++] = 11; rom[p++] = 0x00;
            
            // Icon 2: GAMES (x=80,y=60,w=24,h=24,color=10)
            rom[p++] = 0xF2;
            rom[p++] = 80; rom[p++] = 0x00;
            rom[p++] = 60; rom[p++] = 0x00;
            rom[p++] = 24; rom[p++] = 0x00;
            rom[p++] = 24; rom[p++] = 0x00;
            rom[p++] = 10; rom[p++] = 0x00;
            
            // Icon 3: SETUP (x=140,y=60,w=24,h=24,color=9)
            rom[p++] = 0xF2;
            rom[p++] = 140; rom[p++] = 0x00;
            rom[p++] = 60; rom[p++] = 0x00;
            rom[p++] = 24; rom[p++] = 0x00;
            rom[p++] = 24; rom[p++] = 0x00;
            rom[p++] = 9; rom[p++] = 0x00;
            
            // Draw label pixels for CALC
            const labelCalc = [[26,90,15],[27,90,15],[28,90,15],[29,90,15],
                [26,91,15],[29,91,15],[26,92,15],[29,92,15],[26,93,15],[29,93,15],
                [26,94,15],[27,94,15],[28,94,15],[29,94,15]];
            for (let px of labelCalc) {
                rom[p++] = 0xF0;
                rom[p++] = px[0]; rom[p++] = 0x00;
                rom[p++] = px[1]; rom[p++] = 0x00;
                rom[p++] = px[2]; rom[p++] = 0x00;
            }
            
            // Draw diagonal line pattern on desktop
            for (let i = 0; i < 200; i++) {
                rom[p++] = 0xF0;
                rom[p++] = i; rom[p++] = 0x00;
                rom[p++] = 150 + (i % 50); rom[p++] = 0x00;
                rom[p++] = (i % 14) + 1; rom[p++] = 0x00;
            }
            
            // HALT
            rom[p++] = 0xFF;
            
            log(`ROM created: ${p} bytes of machine code`);
            return rom;
        }
        
        function renderVRAM() {
            const fb = kernel.currentGPU.getFramebuffer();
            if (!fb || fb.length !== 65536) {
                ctx.fillStyle = "#000";
                ctx.fillRect(0, 0, 256, 256);
                return;
            }
            const imgData = ctx.createImageData(256, 256);
            for (let i = 0; i < 65536; i++) {
                const col = fb[i] & 0x0F;
                const [r,g,b] = PAL[col];
                const idx = i * 4;
                imgData.data[idx] = r;
                imgData.data[idx+1] = g;
                imgData.data[idx+2] = b;
                imgData.data[idx+3] = 255;
            }
            ctx.putImageData(imgData, 0, 0);
        }
        
        let animFrame;
        function animationLoop() {
            if (kernel.poweredOn) {
                kernel.run(1000);
            }
            renderVRAM();
            animFrame = requestAnimationFrame(animationLoop);
        }
        
        function boot() {
            log("Booting MiniOS - executing real machine code...");
            
            const rom = createMiniOSROM();
            
            // Write ROM to emulated memory
            for (let i = 0; i < rom.length; i++) {
                kernel.bus.writeByte32(0x08000000 + i, rom[i]);
            }
            
            // Set CPU instruction pointer to ROM start
            kernel.currentCPU.ip = 0x08000000;
            kernel.powerOn(new Uint8Array(256));
            kernel.poweredOn = true;
            kernel.currentCPU.halted = false;
            
            log("✅ CPU executing ROM instructions");
            log("🎨 Drawing via emulated CPU");
        }
        
        document.getElementById('btnPower').onclick = boot;
        
        animationLoop();
        log("MiniOS Ready. Press BOOT to execute real machine code.");
    </script>
</body>
</html>
