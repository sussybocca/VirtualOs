<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>VirtualOS - REAL CPU Execution Test</title>
    <style>
        body { background: #0a0a0f; font-family: monospace; padding: 20px; }
        canvas { image-rendering: pixelated; border: 2px solid #00ffaa; }
        button { background: #0a0a0f; color: #00ffaa; border: 1px solid #00ffaa; padding: 8px 16px; cursor: pointer; }
        .log { color: #00ffaa; font-size: 12px; margin-top: 10px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <canvas id="screen" width="256" height="256"></canvas>
    <div>
        <button id="runBtn">▶ EXECUTE REAL MACHINE CODE</button>
    </div>
    <div class="log" id="log"></div>

    <script src="VirtualOS.js"></script>
    <script>
        const canvas = document.getElementById('screen');
        const ctx = canvas.getContext('2d');
        const logDiv = document.getElementById('log');
        
        function log(msg) {
            logDiv.innerHTML += msg + '\n';
            console.log(msg);
        }
        
        const pal = [
            [0,0,0],[255,255,255],[255,60,60],[60,255,60],
            [60,60,255],[255,255,60],[255,60,255],[60,255,255],
            [255,140,30],[140,60,255],[60,140,255],[255,140,200],
            [100,60,30],[200,180,150],[255,215,0],[80,80,80]
        ];
        
        function renderVRAM(bus) {
            const imgData = ctx.createImageData(256, 256);
            for (let y = 0; y < 256; y++) {
                for (let x = 0; x < 256; x++) {
                    const addr = 0x06000000 + (y * 256 + x);
                    const col = bus.readByte32(addr) & 0x0F;
                    const [r,g,b] = pal[col];
                    const idx = (y * 256 + x) * 4;
                    imgData.data[idx] = r;
                    imgData.data[idx+1] = g;
                    imgData.data[idx+2] = b;
                    imgData.data[idx+3] = 255;
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }
        
        // Build console with custom drawing instruction
        const console = VirtualOS.ConsoleEmulatorFactory.createCustom({
            name: "TestBench",
            bits: 32,
            gpuConfig: { mode: 'pixel', displayWidth: 256, displayHeight: 256 },
            customOpcodes: {
                0xF0: `(bus, regs) => {
                    // DRAW PIXEL: R1=x, R2=y, R3=color
                    const x = Number(regs[1]) & 0xFF;
                    const y = Number(regs[2]) & 0xFF;
                    const col = Number(regs[3]) & 0x0F;
                    bus.writeByte32(0x06000000 + (y * 256 + x), col);
                }`,
                0xF1: `(bus, regs) => {
                    // CLEAR SCREEN
                    for(let i = 0x06000000; i < 0x06010000; i++) bus.writeByte32(i, 0);
                }`
            }
        });
        
        const kernel = console.kernel;
        kernel.switchTo32Bit();
        
        // Allocate VRAM pages
        for (let addr = 0x06000000; addr < 0x06010000; addr += 4096) {
            kernel.bus.pages.set(Math.floor(addr / 4096), new Uint8Array(4096));
        }
        
        // Create REAL machine code ROM that will execute on the CPU
        // This is NOT JavaScript - this is actual emulated CPU instructions
        function createRealROM() {
            const rom = new Uint8Array(256);
            let p = 0;
            
            // Clear screen (0xF1)
            rom[p++] = 0xF1;
            
            // Draw a diagonal line using MOV and DRAW instructions
            // These are REAL CPU instructions that will be fetched, decoded, and executed
            for (let i = 0; i < 64; i++) {
                // MOV R1, i (x coordinate)
                rom[p++] = 0x11; rom[p++] = 0x01; rom[p++] = i; rom[p++] = 0; rom[p++] = 0; rom[p++] = 0;
                // MOV R2, i (y coordinate)  
                rom[p++] = 0x11; rom[p++] = 0x02; rom[p++] = i; rom[p++] = 0; rom[p++] = 0; rom[p++] = 0;
                // MOV R3, 7 (white color)
                rom[p++] = 0x11; rom[p++] = 0x03; rom[p++] = 7; rom[p++] = 0; rom[p++] = 0; rom[p++] = 0;
                // DRAW PIXEL (0xF0)
                rom[p++] = 0xF0;
            }
            
            // HALT
            rom[p++] = 0xFF;
            
            log(`ROM created: ${p} bytes of real machine code`);
            return rom;
        }
        
        async function executeROM() {
            log("\n=== LOADING ROM INTO EMULATED MEMORY ===");
            
            const rom = createRealROM();
            
            // Write ROM to emulated memory at 0x08000000
            for (let i = 0; i < rom.length; i++) {
                kernel.bus.writeByte32(0x08000000 + i, rom[i]);
            }
            
            // Set CPU instruction pointer to ROM start
            kernel.currentCPU.ip = 0x08000000;
            kernel.poweredOn = true;
            kernel.currentCPU.halted = false;
            
            log("CPU IP set to 0x08000000");
            log("Executing machine code...\n");
            
            // Run the emulated CPU - this executes the ROM instructions
            let cycles = 0;
            while (!kernel.currentCPU.halted && cycles < 1000) {
                kernel.currentCPU.cycle();
                cycles++;
            }
            
            log(`CPU executed ${cycles} cycles`);
            log(`CPU HALTED: ${kernel.currentCPU.halted}`);
            
            // Render what the CPU drew
            renderVRAM(kernel.bus);
            log("\n✅ The CPU executed real machine code and drew to VRAM!");
        }
        
        document.getElementById('runBtn').onclick = executeROM;
        
        // Initial render
        renderVRAM(kernel.bus);
        log("Ready. Click button to execute real CPU instructions.");
    </script>
</body>
</html>
