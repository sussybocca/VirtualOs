<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VIR VOS</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030711;color:#dfe8f5;font:12px ui-monospace,SFMono-Regular,Consolas,monospace}
body{display:grid;place-items:center}
#screen{display:block;max-width:100vw;max-height:100vh;width:auto;height:auto;outline:none;background:#030711;box-shadow:0 0 80px #000}
#status{position:fixed;right:12px;bottom:10px;padding:6px 9px;border-radius:7px;background:#050a10b8;border:1px solid #243a54;color:#8fa7be;pointer-events:none;opacity:.85;transition:opacity .5s}
#status.ready{opacity:0}
#error{display:none;position:fixed;inset:20px;overflow:auto;white-space:pre-wrap;background:#14090dcc;border:1px solid #743848;padding:18px;color:#ffd4dc}
</style>
</head>
<body>
<canvas id="screen" width="1280" height="720" tabindex="0" aria-label="VIR VOS display"></canvas>
<div id="status">BOOTING VIR...</div>
<pre id="error"></pre>
<script type="module">
import {VOSRuntime} from './vos-runtime.js';
import * as mod from './module.js';
const screen=document.querySelector('#screen'), status=document.querySelector('#status'), error=document.querySelector('#error');
try {
  const rt=new VOSRuntime({hotMemoryMB:128,shared:globalThis.crossOriginIsolated===true});
  await mod.installVOSModule(rt);
  try { const w=await fetch('./module.wasm'); if(w.ok) await rt.installWasm(new Uint8Array(await w.arrayBuffer())); } catch {}
  rt.display.attach(screen,1280,720,0x20000000);
  if(rt.procedures.has('kernel_main')) await rt.call('kernel_main',0);
  status.textContent='VIR READY — CLICK DISPLAY • F2 TERMINAL';
  setTimeout(()=>status.classList.add('ready'),2200);
  screen.focus();
  globalThis.VOS=rt;
} catch(e) {
  error.style.display='block';
  error.textContent=e.stack||e.message;
  status.textContent='BOOT FAILED';
}
</script>
</body>
</html>
